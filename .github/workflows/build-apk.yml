name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Web Dependencies
        run: |
          pnpm install --no-frozen-lockfile

      - name: Build Web Application
        run: |
          pnpm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Persistent Debug Keystore
        run: |
          mkdir -p keystore
          if [ ! -f keystore/debug.keystore ]; then
            keytool -genkey -v -keystore keystore/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add keystore/debug.keystore
            git commit -m "ci: add persistent debug keystore for consistent app updates [skip ci]" || true
            git push origin main || true
          fi
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Setup Capacitor and Android Platform
        run: |
          pnpm add @capacitor/core
          pnpm add -D @capacitor/cli @capacitor/android
          npx cap add android || true
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Locate & Copy APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/RV-PDF.apk
          echo "APK successfully built at output/RV-PDF.apk"

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RV-PDF-APK
          path: output/RV-PDF.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.5
          name: "RV PDF v1.0.5 - Tool Click Crash Fix & React ErrorBoundary"
          body: |
            ### 📱 RV PDF v1.0.5 Android APK
            
            - 🛠️ **Tool Click White Screen Crash Fixed**:
              - Eliminated React hooks rule violation (conditional hook call in ToolModal).
              - ToolModal now safely mounts on tool select with all hooks executing unconditionally.
            - 🛡️ **React ErrorBoundary Added**:
              - Wrapped root app and individual tool modals in an Error Boundary with an OLED-styled fallback card ("Back to Tools" / "Reload App").
            - 📦 **Package Conflict Resolution**:
              - Updated `appId` to `com.revantram.rvpdf` to resolve package conflict on devices.
            - ⚡ **Mobile Performance & Clean 2×2 Layout**: Full liquid glass dark aesthetic preserved.
          files: output/RV-PDF.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
