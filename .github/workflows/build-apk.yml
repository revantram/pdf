name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Web Dependencies
        run: |
          pnpm install --no-frozen-lockfile

      - name: Build Web Application
        run: |
          pnpm run build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Capacitor and Android Platform
        run: |
          pnpm add @capacitor/core
          pnpm add -D @capacitor/cli @capacitor/android
          npx cap add android || true
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Locate & Copy APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/RV-PDF.apk
          echo "APK successfully built at output/RV-PDF.apk"

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RV-PDF-APK
          path: output/RV-PDF.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.2
          name: "RV PDF v1.0.2 - Android APK Release (Enhanced Compress PDF Flow)"
          body: |
            ### 📱 RV PDF v1.0.2 Android APK
            
            - ⚡ **Enhanced Compress PDF Flow**:
              - Clean status indicators (removed misleading red alert box).
              - Full readable file display with formatted size (e.g. 255.6 KB).
              - Low / Medium / High compression level selector with estimated space reduction.
              - Post-compression comparison card (Original vs Compressed size & % saved).
              - Prominent one-tap direct download button.
            - 🛡️ **Clean Centered Modal Behavior**: Background dimming/blur and backdrop interaction prevention.
          files: output/RV-PDF.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
