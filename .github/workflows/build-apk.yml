name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Web Dependencies
        run: |
          pnpm install --no-frozen-lockfile

      - name: Build Web Application
        run: |
          pnpm run build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Capacitor and Android Platform
        run: |
          pnpm add @capacitor/core
          pnpm add -D @capacitor/cli @capacitor/android
          npx cap add android || true
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Locate & Copy APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/RV-PDF.apk
          echo "APK successfully built at output/RV-PDF.apk"

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RV-PDF-APK
          path: output/RV-PDF.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.4
          name: "RV PDF v1.0.4 - Android APK (Safe-Area Status Bar Fix & Mobile GPU Optimization)"
          body: |
            ### 📱 RV PDF v1.0.4 Android APK
            
            - 🛡️ **Safe-Area Status Bar Fix**: Added `safe-area-header` with `max(calc(env(safe-area-inset-top, 0px) + 8px), 42px)` so status bar indicators (clock, 5G, battery %, notifications) are never covered or clipped.
            - ⚡ **Mobile GPU & 60fps Optimization**:
              - Removed heavy 80px-90px Gaussian blur keyframe animations (`ambient-glow-1/2/3`) for buttery smooth scrolling and true deep OLED `#000000` blacks.
              - Confined card hover transitions to `@media (hover: hover)` to eliminate mobile tap sticky lift.
              - Added immediate active tap depression (`scale(0.97)`).
            - 📐 **Clean 2×2 Grid & Modal UI**:
              - Pure 2×2 tool card grid with zero marketing clutter.
              - Compress PDF modal with subtle green ready badge and full readable file info.
          files: output/RV-PDF.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
